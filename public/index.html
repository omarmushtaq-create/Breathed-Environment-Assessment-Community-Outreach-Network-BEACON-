<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Town Air Watch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --sky: #eef3f0;
    --ink: #1c2b25;
    --haze: #6b7f76;
    --line: #cfd9d3;
    --best: #3f8f5f;
    --good: #8aa63c;
    --bad: #d98d2b;
    --worst: #c0483f;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 32px 24px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--haze);
    font-size: 14px;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  #map {
    height: 340px;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  .sensor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .sensor-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .sensor-card h3 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 600;
  }
  .sensor-card .status {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .status.best { color: var(--best); }
  .status.good { color: var(--good); }
  .status.bad { color: var(--bad); }
  .status.worst { color: var(--worst); }
  .reading {
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }
  .reading span {
    font-size: 13px;
    font-weight: 400;
    color: var(--haze);
  }
  canvas { max-height: 120px; margin-top: 12px; }
  .empty {
    color: var(--haze);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }
  footer {
    text-align: center;
    color: var(--haze);
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Town air watch</h1>
  <p>Live PM2.5 readings from sensors placed around town</p>
</header>

<main>
  <div id="map"></div>
  <div id="sensorGrid" class="sensor-grid">
    <div class="empty">Loading sensor data&hellip;</div>
  </div>
</main>

<footer>Updates automatically every 60 seconds</footer>

<script>
// Map each device name (from config.h's DEVICE_NAME) to a real-world location.
// Add one line here per sensor you deploy.
const SENSOR_LOCATIONS = {
  sensor_01: { lat: 41.28800302268698, lon: -72.95426826901249, label: "Sensor 01" },
  // sensor_02: { lat: 42.53, lon: -70.93, label: "Sensor 02" },
};

function statusFor(pm25) {
  if (pm25 < 40) return { label: "Best", cls: "best" };
  if (pm25 < 80) return { label: "Good", cls: "good" };
  if (pm25 < 120) return { label: "Bad", cls: "bad" };
  return { label: "Worst", cls: "worst" };
}

const map = L.map('map').setView([41.28800302268698, -72.95426826901249], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};
const charts = {};

async function refresh() {
  try {
    const res = await fetch('/.netlify/functions/readings?hours=24');
    const data = await res.json();
    const devices = data.devices || {};
    const grid = document.getElementById('sensorGrid');

    if (Object.keys(devices).length === 0) {
      grid.innerHTML = '<div class="empty">No readings yet. Check back once a sensor uploads.</div>';
      return;
    }

    grid.innerHTML = '';

    for (const [device, readings] of Object.entries(devices)) {
      const latest = readings[readings.length - 1];
      const status = statusFor(latest.pm25);
      const loc = SENSOR_LOCATIONS[device];

      if (loc) {
        if (!markers[device]) {
          markers[device] = L.marker([loc.lat, loc.lon]).addTo(map);
        }
        markers[device].bindPopup(`<b>${loc.label}</b><br>${latest.pm25.toFixed(1)} &micro;g/m&sup3; (${status.label})`);
      }

      const card = document.createElement('div');
      card.className = 'sensor-card';
      card.innerHTML = `
        <h3>${loc ? loc.label : device}</h3>
        <div class="status ${status.cls}">${status.label}</div>
        <div class="reading">${latest.pm25.toFixed(1)} <span>&micro;g/m&sup3;</span></div>
        <canvas id="chart-${device}"></canvas>
      `;
      grid.appendChild(card);

      const ctx = document.getElementById(`chart-${device}`).getContext('2d');
      const labels = readings.map(r => new Date(r.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      const values = readings.map(r => r.pm25);

      if (charts[device]) {
        charts[device].data.labels = labels;
        charts[device].data.datasets[0].data = values;
        charts[device].update();
      } else {
        charts[device] = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              data: values,
              borderColor: '#3f8f5f',
              backgroundColor: 'transparent',
              tension: 0.3,
              pointRadius: 0,
              borderWidth: 2,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              x: { display: false },
              y: { display: true, ticks: { font: { size: 10 } } },
            },
          },
        });
      }
    }
  } catch (err) {
    document.getElementById('sensorGrid').innerHTML =
      `<div class="empty">Couldn't load sensor data: ${err.message}</div>`;
  }
}

refresh();
setInterval(refresh, 60000);
</script>

</body>
</html>
