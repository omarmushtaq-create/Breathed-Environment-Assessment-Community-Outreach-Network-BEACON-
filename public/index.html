<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOWN AIR WATCH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --paper: #F2F0E6;
    --ink: #111111;
    --acid: #D6FF3D;
    --coral: #FF4B3E;
    --cobalt: #2B4EFF;
    --best: #1F9E63;
    --good: #D6FF3D;
    --bad: #FF9F1C;
    --worst: #FF4B3E;
    --shadow: 6px 6px 0 var(--ink);
    --shadow-sm: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
  }
  .display { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; }

  header {
    background: var(--acid);
    border-bottom: 4px solid var(--ink);
    padding: 40px 24px 32px;
  }
  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(32px, 6vw, 54px);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  header .tag {
    font-size: 13px;
    font-weight: 600;
    border: 3px solid var(--ink);
    background: var(--paper);
    padding: 6px 12px;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  header p {
    max-width: 1080px;
    margin: 14px auto 0;
    font-size: 14px;
    font-weight: 500;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .block-label {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: var(--ink);
    color: var(--paper);
    padding: 4px 10px;
    margin-bottom: 14px;
  }

  #map {
    height: 360px;
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
    filter: grayscale(1) contrast(1.1);
  }

  .sensor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 24px;
  }
  .sensor-card {
    background: #ffffff;
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 20px;
    position: relative;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .sensor-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
  }
  .sensor-card h3 {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .status {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 3px solid var(--ink);
    padding: 3px 10px;
    margin-bottom: 14px;
    transform: rotate(-1.5deg);
  }
  .status.best { background: var(--best); color: #fff; }
  .status.good { background: var(--good); color: var(--ink); }
  .status.bad { background: var(--bad); color: var(--ink); }
  .status.worst { background: var(--worst); color: #fff; }

  .reading {
    font-family: 'Archivo Black', sans-serif;
    font-size: 42px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .reading span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }
  canvas { max-height: 120px; margin-top: 14px; }

  .empty {
    font-size: 14px;
    font-weight: 600;
    padding: 48px 24px;
    text-align: center;
    border: 4px dashed var(--ink);
    background: #fff;
  }

  footer {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    padding: 24px;
    border-top: 4px solid var(--ink);
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 class="display">Town<br>air watch</h1>
    <div class="tag">LIVE // PM2.5</div>
  </div>
  <p>Real-time particulate readings from sensors placed around town</p>
</header>

<main>
  <div>
    <span class="block-label">Sensor map</span>
    <div id="map"></div>
  </div>

  <div>
    <span class="block-label">Readings</span>
    <div id="sensorGrid" class="sensor-grid">
      <div class="empty">Loading sensor data&hellip;</div>
    </div>
  </div>
</main>

<footer>Updates automatically every 60 seconds</footer>

<script>
// Map each device name (from config.h's DEVICE_NAME) to a real-world location.
// Add one line here per sensor you deploy.
const SENSOR_LOCATIONS = {
  sensor_01: { lat: 41.28800302268698, lon: -72.95426826901249, label: "Sensor 01" },
  // sensor_02: { lat: 42.53, lon: -70.93, label: "Sensor 02" },
};

function statusFor(pm25) {
  if (pm25 < 40) return { label: "Best", cls: "best" };
  if (pm25 < 80) return { label: "Good", cls: "good" };
  if (pm25 < 120) return { label: "Bad", cls: "bad" };
  return { label: "Worst", cls: "worst" };
}

const map = L.map('map').setView([41.28800302268698, -72.95426826901249], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};
const charts = {};

async function refresh() {
  try {
    const res = await fetch('/.netlify/functions/readings?hours=24');
    const data = await res.json();
    const devices = data.devices || {};
    const grid = document.getElementById('sensorGrid');

    if (Object.keys(devices).length === 0) {
      grid.innerHTML = '<div class="empty">No readings yet. Check back once a sensor uploads.</div>';
      return;
    }

    grid.innerHTML = '';

    for (const [device, readings] of Object.entries(devices)) {
      const latest = readings[readings.length - 1];
      const status = statusFor(latest.pm25);
      const loc = SENSOR_LOCATIONS[device];

      if (loc) {
        if (!markers[device]) {
          markers[device] = L.marker([loc.lat, loc.lon]).addTo(map);
        }
        markers[device].bindPopup(`<b>${loc.label}</b><br>${latest.pm25.toFixed(1)} &micro;g/m&sup3; (${status.label})`);
      }

      const card = document.createElement('div');
      card.className = 'sensor-card';
      card.innerHTML = `
        <h3>${loc ? loc.label : device}</h3>
        <div class="status ${status.cls}">${status.label}</div>
        <div class="reading">${latest.pm25.toFixed(1)} <span>&micro;g/m&sup3;</span></div>
        <canvas id="chart-${device}"></canvas>
      `;
      grid.appendChild(card);

      const canvasEl = document.getElementById(`chart-${device}`);
      if (!canvasEl) {
        console.warn(`Skipping chart for device "${device}" — canvas not found`);
        continue;
      }
      const ctx = canvasEl.getContext('2d');
      const labels = readings.map(r => new Date(r.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      const values = readings.map(r => r.pm25);

      if (charts[device]) {
        charts[device].data.labels = labels;
        charts[device].data.datasets[0].data = values;
        charts[device].update();
      } else {
        charts[device] = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              data: values,
              borderColor: '#111111',
              backgroundColor: 'transparent',
              tension: 0,
              pointRadius: 0,
              borderWidth: 3,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              x: { display: false },
              y: {
                display: true,
                ticks: { font: { size: 10, family: 'IBM Plex Mono' } },
                grid: { color: '#11111122' },
              },
            },
          },
        });
      }
    }
  } catch (err) {
    document.getElementById('sensorGrid').innerHTML =
      `<div class="empty">Couldn't load sensor data: ${err.message}</div>`;
  }
}

refresh();
setInterval(refresh, 60000);
</script>

</body>
</html>
